# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Mahdis Rabbani
# Used by jekyll-seo-tag for the homepage <title>: "Mahdis Rabbani | <tagline>"
tagline: Ph.D. Candidate in Robotics & Control at UC Davis
email: mrabbani@ucdavis.edu
description: >-
  Mahdis Rabbani is a Mechanical Engineering Ph.D. candidate at UC Davis
  researching interaction-aware motion planning, game-theoretic control,
  and autonomous systems.
baseurl: "" # the subpath of your site, e.g. /blog
url: https://mahdiss99.github.io   # canonical, lowercase, HTTPS
lang: en
locale: en_US

# Author / Person data (jekyll-seo-tag author meta + Person JSON-LD in _includes/head.html)
author:
  name: Mahdis Rabbani
  url: https://mahdiss99.github.io/
  job_title: Ph.D. Candidate in Mechanical Engineering
  affiliation: University of California, Davis
  affiliation_url: https://www.ucdavis.edu/
  same_as:
    - https://www.linkedin.com/in/mahdis-rabbani
    - https://scholar.google.com/citations?user=0O-aLs8AAAAJ

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
# Collections: one document per project / position.
#   _projects/<slug>.md    -> /projects/<slug>/   (listed on /projects/, featured ones on /)
#   _experiences/<slug>.md -> /experience/<slug>/ (listed on /experience/ and /)
#
# Rule: one project = one authoritative set of metadata and media; many presentation components.
#   A project's front matter is the only place its shared facts live; every component reads it:
#     title, category, order, featured, date_label   identity and placement
#     description, outcome_label, outcome            takeaway + result (homepage, /projects/, page lead, SEO)
#     image                                          static thumbnail / social-preview image
#     preview_video, preview_poster                  optional 3:2 looping cover (thumbnails everywhere)
#     cover_video, cover_poster, cover_width/height, optional large cover on the project page,
#       cover_caption                                  placed in the body with {% include case-cover.html %}
#     meta                                           side-panel details on the project page
#   Publications are linked to projects in _data/research_links.yml; experiences list related
#   projects by slug (related_projects). Components may change size and layout, never the facts.
collections:
  projects:
    output: true
    permalink: /projects/:name/
  experiences:
    output: true
    permalink: /experience/:name/

defaults:
  # Social-preview image for every page; projects override it with their own `image`.
  - scope:
      path: ""
    values:
      image: /assets/images/profile.jpg
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      seo:
        type: WebPage
  # The starter "Welcome to Jekyll" post is not part of the portfolio.
  - scope:
      path: ""
      type: posts
    values:
      sitemap: false
  - scope:
      path: ""
      type: experiences
    values:
      layout: experience
      seo:
        type: WebPage

header_pages:
  - projects.md   # Projects page will appear first
  - publication.md
  - skills.md
  - teaching.md
